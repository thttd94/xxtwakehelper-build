name: Build ShadowResetHelper IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'ShadowResetHelper/**'
      - '.github/workflows/build-shadowresethelper.yml'
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install ldid xz && git clone --recursive https://github.com/theos/theos.git ~/theos
      - run: export THEOS=~/theos; cd ShadowResetHelper; chmod +x build.sh; ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowResetHelper-ipa
          path: ShadowResetHelper/ShadowResetHelper.ipa
